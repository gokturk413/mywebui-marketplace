# Public repository: GitHub-hosted runners only (never the self-hosted ones: fork pull requests
# would run on that machine). A pull request is checked; main publishes _site to GitHub Pages.
name: registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # packages published on GitHub (topic mywebui-package) show up by themselves within the hour
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # packages on GitHub: repositories with the topic mywebui-package (not for pull requests)
      - if: github.event_name != 'pull_request'
        run: node scripts/discover.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # downloads every package and checks it the way mywebui does
      - run: node scripts/build-index.mjs --verify
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
